spring:

  application:
    name: check-card

  data:
    mongodb:
      uri: ${MONGO_URI}


  mail:
    host: ${MAIL_HOST}
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

application:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: 3600000

server:
  port: ${PORT:8080}
